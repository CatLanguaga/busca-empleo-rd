# Registro de empleadores dominicanos y dónde publican sus vacantes.
#
# Dos fuentes de información por empleador, que no se mezclan:
#
#   estado / donde / url / vacantes   lo que observó el detector (descubrir.mjs) por HTTP.
#                                     No se escribe a mano: sale de correr el detector.
#   mapeo                             lo que se observó revisando el sitio. `via: navegador`
#                                     es la revisión de mapeo de docs/MAPEO.md; `via: http`
#                                     significa que bastó el detector.
#   empleo                            portal de empleo del empleador, cuando se conoce.
#                                     Si está, el detector empieza por ahí.
#
# Todo es una foto de la fecha indicada; los sitios cambian. Significado de cada
# estado en docs/EMPRESAS.md.
#
# Para añadir un empleador: nombre, sector y web. Luego corre el detector y, si
# no lo resuelve, la revisión de mapeo.

